<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Câu 3: Slideshow</title>

        <link rel="icon" type="image/x-icon" href="../images/favicon.jpg">
        <link rel="stylesheet" href="css/styles.css" />
    </head>
    <body>
        <div class="wrapper">
            <div class="btn-back-wrapper">
                <a href="../index.html" class="back-link">← Quay lại</a>
            </div>
            <div class="content-title-wrapper">
                <h1 class="content-title">Câu 3: Slideshow</h1>
            </div>
            <div class="carousel-container" id="carousel" tabindex="0">
                <div class="carousel-counter" id="counterDisplay"></div>
                
                <div class="carousel-track" id="track">
                    <div class="carousel-slide"><img src="images/slide-1.avif" alt="Ảnh 1"></div>
                    <div class="carousel-slide"><img src="images/slide-2.avif" alt="Ảnh 2"></div>
                    <div class="carousel-slide"><img src="images/slide-3.avif" alt="Ảnh 3"></div>
                    <div class="carousel-slide"><img src="images/slide-4.avif" alt="Ảnh 4"></div>
                    <div class="carousel-slide"><img src="images/slide-5.avif" alt="Ảnh 5"></div>
                </div>

                <button class="carousel-btn btn-prev" id="prevBtn" aria-label="Slide trước">&#10094;</button>
                <button class="carousel-btn btn-next" id="nextBtn" aria-label="Slide tiếp theo">&#10095;</button>

                <div class="carousel-dots" id="dotsContainer"></div>
            </div>
        </div>

        <script src="js/script.js"></script>
    </body>
</html>
